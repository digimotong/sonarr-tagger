name: Docker Build, Push and Release

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  DOCKERHUB_REPO: digimotong/sonarr-tagger

# Least privilege: the only credential needed is the Docker Hub login below.
permissions:
  contents: read

# Queue release runs instead of cancelling them: a cancelled run could leave a
# release half-published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # Prefixed "release-" to keep job names unique across workflows: tests.yml also
  # defines `lint` and `test`, and GitHub warns that a check name shared by two
  # workflows gives ambiguous results for required status checks - which can block
  # PRs from ever merging. Renaming here (not in tests.yml) keeps the checks that
  # gate `main` named exactly as they are today.
  release-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pylint
        run: pylint sonarr-tagger

  release-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: python -m pytest -v

  verify-version:
    runs-on: ubuntu-latest
    # Only meaningful for a real release tag; workflow_dispatch has no tag.
    if: github.event_name == 'release'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: VERSION in main.py matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(grep -oP '^VERSION = "\K[^"]+' sonarr-tagger/main.py)"
          echo "main.py VERSION: $version"
          echo "release tag:     $TAG"
          # Fail before anything is published rather than shipping an image whose
          # reported version and image tag disagree.
          test "v$version" = "$TAG"

  build-and-push:
    runs-on: ubuntu-latest
    needs: [release-lint, release-test, verify-version]
    # workflow_dispatch skips verify-version, and a skipped need would otherwise
    # cause this job to be skipped too.
    if: always() && !failure() && !cancelled()

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.DOCKERHUB_REPO }}
          # On a release tag the semver line produces X.Y.Z and also flips
          # latest on by itself (the action's 'auto' default), so the raw line
          # below is what keeps :latest working for workflow_dispatch runs.
          # Removing it would leave latest stale / missing - not a bug to fix.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
