name: tests

on:
  push:
  pull_request:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is included because it is what the Dockerfile now pins: test the
        # interpreter the shipped image actually runs. The `lint` job below stays
        # on a single version on purpose - matrixing it would rename the required
        # status check from `lint` to `lint (3.12)` and block every merge.
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
        shell: bash

      # Coverage flags are passed explicitly (not via pytest.ini addopts) so that
      # running a single test file locally does not trip the coverage floor.
      # The 98 floor is the measured value rounded down: only the
      # `if __name__ == "__main__":` line is unreachable under import.
      - name: Run pytest
        # PYTEST_HANG_TIMEOUT (read by tests/conftest.py) is a backstop: the
        # autouse sleep guard should turn any unbounded poll loop into an immediate
        # failure, and if that guard is ever removed this still fails the job
        # instead of burning its full timeout.
        run: |
          python -m pytest -v --cov=main --cov-report=term-missing --cov-fail-under=98
        shell: bash
        env:
          PYTEST_HANG_TIMEOUT: '60'

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
        shell: bash

      - name: Run pylint
        run: pylint sonarr-tagger
        shell: bash

  # The Dockerfile cannot be exercised by the unit tests: build it and prove the
  # two properties the tests cannot see (it starts, and it does not run as root).
  dockerfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t sonarr-tagger:ci .

      - name: Container runs as a non-root user
        run: |
          uid="$(docker run --rm --entrypoint id sonarr-tagger:ci -u)"
          echo "container uid: $uid"
          test "$uid" = "1000"

      # --version short-circuits before any configuration is read, so this needs
      # no env vars and cannot hit the network.
      - name: Entrypoint starts and reports its version
        run: docker run --rm sonarr-tagger:ci python main.py --version

      - name: Missing configuration fails fast with exit 1
        run: |
          set +e
          output="$(docker run --rm sonarr-tagger:ci python main.py 2>&1)"
          status=$?
          set -e
          echo "$output"
          test "$status" = "1"
          echo "$output" | grep -q "Configuration error"

  # sonarr-tagger and radarr-tagger are near-duplicates maintained as separate
  # repositories, and each auto-deploys on its own. A hardening fix applied to
  # one therefore misses the other - which is how this sibling ended up without
  # the empty-API-key guard. tests/test_twin_parity.py compares the logic that
  # must stay identical, but it needs both checkouts to do so, which the plain
  # `test` job above cannot provide.
  #
  # `parity` is a required status check in both repositories, so its *name* is
  # load-bearing: renaming the job (or matrixing it, which would rename it to
  # `parity (3.12)`) leaves the required `parity` context reporting nothing, and
  # an unreported required check blocks every merge instead of failing visibly.
  # The bare `push:`/`pull_request:` triggers above are load-bearing in the same
  # way - a `paths:`/`branches:` filter would skip the whole run on matching
  # PRs, which is precisely when the required check has to report.
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sonarr-tagger

      # Prefer the matching branch on the sibling over its default branch. The
      # twin change lands as its own PR, so the sibling's default branch would
      # still hold the old code and this job would fail until that PR merged.
      # github.head_ref is only set on pull_request runs, so a push to main
      # falls back to the ref name (main) on both sides.
      #
      # The branch is probed before it is used, because it does not always exist
      # on the sibling: Dependabot names its branches itself and per repository
      # (`dependabot/pip/...`), so a weekly bump PR here has no counterpart
      # there. Feeding that name straight to `ref` would fail the checkout, and
      # once this job is a required status check that would make every
      # dependency PR permanently unmergeable - including the action bumps that
      # keep the SHA pins from going stale. An empty `ref` means "the target
      # repository's default branch", which is the honest comparison for a
      # change that is not a twin change.
      - name: Resolve the sibling ref
        id: sibling
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          if git ls-remote --exit-code --heads \
               https://github.com/digimotong/radarr-tagger \
               "refs/heads/$branch" > /dev/null 2>&1; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
            echo "sibling has '$branch'; comparing like for like"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "::notice::sibling has no '$branch'; comparing against its default branch"
          fi
        shell: bash

      - name: Checkout the sibling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: digimotong/radarr-tagger
          path: radarr-tagger
          ref: ${{ steps.sibling.outputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sonarr-tagger/requirements-dev.txt
        shell: bash

      # Only the parity file: the sibling's own suite runs in its own workflow,
      # and its coverage floor belongs there. The sibling repo is checked out
      # without its dependencies, so nothing else can be imported from it.
      #
      # PARITY_REQUIRE_SIBLING turns the module's "sibling not checked out" skip
      # into a failure. Without it a botched sibling checkout would exit 0 having
      # asserted nothing, and this job is meant to be a required status check.
      - name: Run the twin-divergence check
        run: |
          python -m pytest sonarr-tagger/tests/test_twin_parity.py -v
        shell: bash
        env:
          PARITY_REQUIRE_SIBLING: '1'
