name: tests

on:
  push:
  pull_request:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
        shell: bash

      # Coverage flags are passed explicitly (not via pytest.ini addopts) so that
      # running a single test file locally does not trip the coverage floor.
      # The 98 floor is the measured value rounded down: only the
      # `if __name__ == "__main__":` line is unreachable under import.
      - name: Run pytest
        # PYTEST_HANG_TIMEOUT (read by tests/conftest.py) is a backstop: the
        # autouse sleep guard should turn any unbounded poll loop into an immediate
        # failure, and if that guard is ever removed this still fails the job
        # instead of burning its full timeout.
        run: |
          python -m pytest -v --cov=main --cov-report=term-missing --cov-fail-under=98
        shell: bash
        env:
          PYTEST_HANG_TIMEOUT: '60'

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
        shell: bash

      - name: Run pylint
        run: pylint sonarr-tagger
        shell: bash

  # The Dockerfile cannot be exercised by the unit tests: build it and prove the
  # two properties the tests cannot see (it starts, and it does not run as root).
  dockerfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t sonarr-tagger:ci .

      - name: Container runs as a non-root user
        run: |
          uid="$(docker run --rm --entrypoint id sonarr-tagger:ci -u)"
          echo "container uid: $uid"
          test "$uid" = "1000"

      # --version short-circuits before any configuration is read, so this needs
      # no env vars and cannot hit the network.
      - name: Entrypoint starts and reports its version
        run: docker run --rm sonarr-tagger:ci python main.py --version

      - name: Missing configuration fails fast with exit 1
        run: |
          set +e
          output="$(docker run --rm sonarr-tagger:ci python main.py 2>&1)"
          status=$?
          set -e
          echo "$output"
          test "$status" = "1"
          echo "$output" | grep -q "Configuration error"
