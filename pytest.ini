[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra
# Coverage flags deliberately live in the CI invocation, not here: addopts applies
# to every run, so `pytest tests/test_docs.py` would fail on a coverage floor it
# was never meant to meet, and each subprocess in the mutation harness would pay
# for instrumentation it does not use. Run `pytest --cov=main` for a report.
